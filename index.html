<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build Generator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --ink: #25223b;
      --muted: #716d86;
      --paper: #f7f3ff;
      --panel: rgba(255, 255, 255, .82);
      --line: #e5ddf1;
      --blue: #4e9fff;
      --purple: #7654e8;
      --leaf: #45ad6a;
      --leaf-dark: #28734b;
      --sun: #ffd447;
      --red: #ef5b68;
      --coral: #ef5b68;
      --mint: #62d8bd;
      --sky: #75c9ff;
      --shadow: 0 22px 60px rgba(88, 64, 150, .16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 10% 8%, rgba(255, 212, 71, .36), transparent 22%),
        radial-gradient(circle at 88% 12%, rgba(78, 159, 255, .3), transparent 24%),
        radial-gradient(circle at 72% 88%, rgba(69, 173, 106, .24), transparent 25%),
        radial-gradient(circle at 38% 62%, rgba(239, 91, 104, .16), transparent 22%),
        radial-gradient(#dfd5f1 1px, transparent 1px);
      background-size: auto, auto, auto, auto, 22px 22px;
      background-attachment: scroll;
    }

    .shell { max-width: 1180px; margin: 0 auto; padding: 42px 24px 64px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 34px; animation: floatIn .7s ease both; position: relative; padding-right: 250px; }
    .eyebrow { color: var(--leaf); font: 500 12px 'DM Mono', monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { font-size: clamp(42px, 7vw, 78px); line-height: .92; letter-spacing: -.07em; margin: 10px 0 14px; max-width: 650px; background: linear-gradient(100deg, var(--leaf-dark), var(--purple), var(--red), var(--blue)); color: transparent; background-clip: text; -webkit-background-clip: text; }
    .intro { color: var(--muted); max-width: 530px; font-size: 17px; line-height: 1.5; margin: 0; }
    .badge { border: 1px solid #d9cdf4; padding: 12px 14px; background: rgba(255,255,255,.72); color: var(--leaf-dark); font: 500 12px 'DM Mono', monospace; white-space: nowrap; border-radius: 999px; box-shadow: 0 8px 20px rgba(88, 64, 150, .08); }
    .board-corner { position: absolute; top: -12px; right: 0; width: 226px; text-align: center; }
    .board-model-label { display: block; margin-bottom: 8px; color: var(--muted); font: 500 10px 'DM Mono', monospace; letter-spacing: .1em; text-transform: uppercase; }
    .board-stage { height: 126px; perspective: 620px; cursor: crosshair; touch-action: none; }
    .board-model { --board-color: #28734b; --board-edge: #17482f; --board-glow: rgba(69,173,106,.34); --model-scale: 1; --tilt-x: 0deg; --tilt-y: 0deg; width: 172px; height: 94px; position: relative; margin: 16px auto 0; transform-style: preserve-3d; transform: rotateX(calc(18deg + var(--tilt-y))) rotateY(calc(-24deg + var(--tilt-x))) rotateZ(-3deg) scale(var(--model-scale)); transition: transform .18s ease, filter .25s ease; filter: drop-shadow(0 18px 12px rgba(47,31,84,.25)); }
    .board-model:hover { filter: drop-shadow(0 22px 16px var(--board-glow)); }
    .board-face { position: absolute; inset: 0; border: 2px solid var(--board-edge); border-radius: 10px; background: linear-gradient(135deg, var(--board-color), color-mix(in srgb, var(--board-color) 72%, #10152d)); box-shadow: inset 0 0 0 3px rgba(255,255,255,.08), inset 0 0 24px rgba(0,0,0,.22); transform: translateZ(6px); overflow: hidden; }
    .board-face:before { content: ''; position: absolute; inset: 10px; border: 1px dashed rgba(255,255,255,.24); border-radius: 5px; background: repeating-linear-gradient(90deg, transparent 0 16px, rgba(255,212,71,.25) 17px 19px, transparent 20px 32px), repeating-linear-gradient(0deg, transparent 0 13px, rgba(117,201,255,.22) 14px 16px, transparent 17px 27px); opacity: .75; }
    .board-face:after { content: ''; position: absolute; width: 42px; height: 42px; left: 65px; top: 25px; border-radius: 5px; background: linear-gradient(145deg, #202844, #0c1224); box-shadow: 0 0 0 3px rgba(117,201,255,.28), 0 0 18px var(--board-glow); }
    .board-side { position: absolute; background: var(--board-edge); }
    .board-side.front { width: 100%; height: 12px; left: 0; bottom: -10px; transform: rotateX(-90deg); transform-origin: top; border-radius: 0 0 7px 7px; }
    .board-side.right { width: 12px; height: 100%; right: -10px; top: 0; transform: rotateY(90deg); transform-origin: left; border-radius: 0 7px 7px 0; }
    .board-pin { position: absolute; z-index: 2; width: 5px; height: 10px; border-radius: 2px; background: #ffd447; box-shadow: 0 0 5px rgba(255,212,71,.8); transform: translateZ(8px); }
    .board-pin.p1 { left: 10px; top: 14px; } .board-pin.p2 { left: 10px; top: 31px; } .board-pin.p3 { left: 10px; top: 48px; } .board-pin.p4 { left: 10px; top: 65px; }
    .board-pin.p5 { right: 10px; top: 14px; } .board-pin.p6 { right: 10px; top: 31px; } .board-pin.p7 { right: 10px; top: 48px; } .board-pin.p8 { right: 10px; top: 65px; }
    .board-led { position: absolute; z-index: 3; right: 43px; top: 19px; width: 7px; height: 7px; border-radius: 50%; background: #ef5b68; box-shadow: 0 0 10px #ef5b68; transform: translateZ(10px); animation: modelPulse 2.4s ease-in-out infinite; }
    .board-antenna { display: none; position: absolute; z-index: 4; left: -29px; top: 24px; width: 39px; height: 47px; border: 2px solid #080a0f; border-right: 0; border-radius: 5px 0 0 5px; background: #242a35; transform: translateZ(10px) rotateZ(-2deg); box-shadow: inset 0 0 0 1px rgba(117,201,255,.18), -5px 4px 10px rgba(0,0,0,.22); overflow: hidden; }
    .board-antenna:before { content: ''; position: absolute; inset: 6px 5px; background: repeating-linear-gradient(90deg, transparent 0 4px, #ffd447 5px 7px, transparent 8px 11px), linear-gradient(180deg, rgba(255,212,71,.9), rgba(239,170,26,.35)); -webkit-mask: repeating-linear-gradient(180deg, #000 0 3px, transparent 3px 7px); mask: repeating-linear-gradient(180deg, #000 0 3px, transparent 3px 7px); filter: drop-shadow(0 0 3px rgba(255,212,71,.9)); }
    .board-antenna:after { content: ''; position: absolute; right: -2px; top: 18px; width: 8px; height: 10px; border-radius: 2px; background: #ffd447; box-shadow: 0 0 6px rgba(255,212,71,.9); }
    @keyframes modelPulse { 50% { opacity: .45; box-shadow: 0 0 3px #ef5b68; } }
    .board-model[data-board="ESP32"] { --board-color: #171b24; --board-edge: #080a0f; --board-glow: rgba(117,201,255,.42); }
    .board-model[data-board="ESP32"] .board-antenna { display: block; }
    .board-model[data-board="Arduino Uno"] { --board-color: #2476a8; --board-edge: #164766; --board-glow: rgba(78,159,255,.38); }
    .board-model[data-board="Arduino Nano"] { --board-color: #8c4ec4; --board-edge: #57267e; --board-glow: rgba(118,84,232,.38); --model-scale: .82; }
    .board-model[data-board="Raspberry Pi Pico"] { --board-color: #c45b46; --board-edge: #743022; --board-glow: rgba(239,91,104,.38); }

    main { display: grid; grid-template-columns: 330px 1fr; gap: 22px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid rgba(255,255,255,.9); box-shadow: var(--shadow); border-radius: 24px; overflow: hidden; animation: floatIn .8s ease both; }
    .panel:hover { box-shadow: 0 26px 70px rgba(88, 64, 150, .21); }
    .controls { padding: 24px; position: sticky; top: 18px; }
    .section-label { display: inline-flex; align-items: center; gap: 8px; font: 500 11px 'DM Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
    .section-label:after { content: ''; width: 34px; height: 4px; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--purple), var(--red), var(--sun), var(--leaf)); }
    .control-group { border-bottom: 1px solid var(--line); padding-bottom: 22px; margin-bottom: 22px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    select { width: 100%; border: 1px solid #d9cdf4; border-radius: 12px; background: #fbf9ff; color: var(--ink); padding: 12px; font: inherit; cursor: pointer; }
    .parts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 390px; overflow-y: auto; padding-right: 4px; }
    .part { position: relative; }
    .part input { position: absolute; opacity: 0; }
    .part span { display: block; border: 1px solid var(--line); border-radius: 12px; padding: 10px 9px; font-size: 12px; cursor: pointer; background: #fbf9ff; transition: .18s ease; }
    .part span:hover { transform: translateY(-2px); border-color: #b9a6f4; box-shadow: 0 8px 16px rgba(88, 64, 150, .08); }
    .part input:checked + span { background: linear-gradient(135deg, #fff6c9, #dff8e9); border-color: var(--leaf); color: var(--leaf-dark); box-shadow: inset 3px 0 var(--leaf), 0 8px 16px rgba(40, 115, 75, .12); }
    .generate, .stranger { position: relative; isolation: isolate; overflow: hidden; background-size: 220% 100%; transition: transform .18s, box-shadow .18s, background-position .5s; }
    .generate:before, .stranger:before { content: ''; position: absolute; z-index: -1; width: 45%; height: 180%; top: -40%; left: -55%; background: rgba(255,255,255,.42); transform: rotate(18deg); transition: left .55s ease; }
    .generate { width: 100%; border: 0; border-radius: 14px; padding: 15px; color: #fff; background-image: linear-gradient(110deg, #4e9fff, #7654e8 34%, #ef5b68 66%, #ffd447); font: 700 14px 'Space Grotesk'; cursor: pointer; box-shadow: 0 10px 20px rgba(118, 84, 232, .25); }
    .generate:hover { transform: translateY(-3px); background-position: 100% 0; box-shadow: 0 15px 26px rgba(118, 84, 232, .36); }
    .generate:hover:before, .stranger:hover:before { left: 115%; }
    .generate:active, .stranger:active { transform: translateY(-1px) scale(.99); }
    .surprise { position: relative; isolation: isolate; overflow: hidden; width: 100%; margin-top: 9px; padding: 12px 10px; border: 0; border-radius: 12px; color: #fff; background: linear-gradient(105deg, var(--blue), var(--purple) 25%, var(--red) 50%, var(--sun) 75%, var(--leaf)); background-size: 220% 100%; font: 700 12px 'DM Mono'; cursor: pointer; box-shadow: 0 9px 18px rgba(118, 84, 232, .22); transition: transform .18s, box-shadow .18s, background-position .5s; }
    .surprise:before { content: ''; position: absolute; z-index: -1; width: 45%; height: 180%; top: -40%; left: -55%; background: rgba(255,255,255,.42); transform: rotate(18deg); transition: left .55s ease; }
    .surprise:hover { transform: translateY(-3px) scale(1.01); background-position: 100% 0; box-shadow: 0 14px 25px rgba(118, 84, 232, .32); }
    .surprise:hover:before { left: 115%; }
    .surprise:active { transform: translateY(-1px) scale(.99); }
    .surprise:after, .stranger:after { content: '✦  ✧'; position: absolute; right: 13px; top: 50%; color: rgba(255,255,255,.9); font-size: 15px; letter-spacing: 4px; transform: translateY(-50%) scale(.7); opacity: .35; animation: sparklePulse 2.2s ease-in-out infinite; pointer-events: none; }
    .stranger:after { content: '✧  ✦'; left: 13px; right: auto; animation-delay: .8s; }
    .surprise:hover:after, .stranger:hover:after { opacity: 1; transform: translateY(-50%) scale(1); }
    @keyframes sparklePulse {
      0%, 100% { opacity: .3; transform: translateY(-50%) scale(.7) rotate(0deg); }
      50% { opacity: 1; transform: translateY(-50%) scale(1.05) rotate(12deg); }
    }
    .stranger { width: 100%; margin-top: 9px; padding: 12px 10px; border: 0; border-radius: 12px; color: #fff; background-image: linear-gradient(110deg, #ffd447, #ef5b68 35%, #7654e8 68%, #4e9fff); font: 700 12px 'DM Mono'; cursor: pointer; box-shadow: 0 9px 18px rgba(239, 91, 104, .2); }
    .stranger:hover { transform: translateY(-3px) rotate(-.5deg); background-position: 100% 0; box-shadow: 0 13px 23px rgba(239, 91, 104, .3); }
    .mode-label { margin-top: 15px; }
    #difficulty, #mode, #category, #personality { border: 2px solid transparent; background: linear-gradient(#fff, #fff) padding-box, linear-gradient(100deg, var(--blue), var(--purple), var(--red), var(--sun), var(--leaf)) border-box; box-shadow: 0 8px 18px rgba(118, 84, 232, .12); font-weight: 600; transition: transform .18s, box-shadow .25s; }
    #category { background: linear-gradient(#fffdf0, #fffdf0) padding-box, linear-gradient(100deg, var(--sun), var(--leaf), var(--blue), var(--purple)) border-box; box-shadow: 0 8px 20px rgba(69, 173, 106, .16); }
    #personality { background: linear-gradient(#fff5fb, #fff5fb) padding-box, linear-gradient(100deg, var(--purple), var(--red), var(--blue), var(--sun)) border-box; box-shadow: 0 8px 20px rgba(239, 91, 104, .14); }
    #difficulty:hover, #mode:hover, #category:hover, #personality:hover { transform: translateY(-2px); box-shadow: 0 12px 23px rgba(118, 84, 232, .2); }
    #difficulty:focus, #mode:focus, #category:focus, #personality:focus { outline: 3px solid rgba(78, 159, 255, .2); transform: translateY(-2px); box-shadow: 0 12px 23px rgba(69, 173, 106, .2); }
    #difficulty option, #mode option, #category option, #personality option { color: var(--ink); background: #fff; font-weight: 600; }

    .result { min-width: 0; }
    .result-hero { padding: 30px; background: linear-gradient(120deg, #28734b 0%, #4e9fff 30%, #7654e8 57%, #ef5b68 82%, #ffd447 125%); color: #fff; position: relative; overflow: hidden; }
    .result-hero:after { content: ''; position: absolute; width: 210px; height: 210px; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; right: -55px; top: -85px; box-shadow: 0 0 0 24px rgba(255,255,255,.05), 0 0 0 48px rgba(255,255,255,.04); }
    .result-hero h2 { font-size: clamp(30px, 5vw, 54px); letter-spacing: -.055em; line-height: 1; margin: 12px 0; max-width: 650px; position: relative; z-index: 1; }
    .result-hero p { max-width: 620px; line-height: 1.5; color: #f4ffe8; margin: 0; position: relative; z-index: 1; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; position: relative; z-index: 1; }
    .meta span { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1); border-radius: 999px; padding: 7px 9px; font: 11px 'DM Mono'; }
    .result-body { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .info-block { min-width: 0; }
    .info-block.full { grid-column: 1 / -1; }
    .info-block h3 { margin: 0 0 13px; font-size: 18px; letter-spacing: -.03em; color: var(--leaf-dark); }
    .wire { display: flex; gap: 12px; align-items: flex-start; border-top: 1px solid var(--line); padding: 12px 10px; font-size: 13px; line-height: 1.4; border-radius: 10px; transition: transform .2s, background .2s; }
    .wire:hover { transform: translateX(6px); background: linear-gradient(90deg, #eef7ff, #fff5d8, #effbed); }
    .wire:first-of-type { border-top: 0; padding-top: 0; }
    .pin { min-width: 48px; color: var(--coral); font: 500 12px 'DM Mono'; }
    ul { margin: 0; padding-left: 19px; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .code-wrap { background: #29233f; color: #eeeaff; position: relative; border-radius: 16px; overflow: hidden; }
    pre { overflow-x: auto; padding: 22px; margin: 0; font: 12px/1.7 'DM Mono', monospace; min-height: 240px; }
    .copy { position: absolute; top: 10px; right: 10px; border: 1px solid #7463b9; border-radius: 999px; background: #403566; color: #eeeaff; padding: 8px 10px; font: 11px 'DM Mono'; cursor: pointer; }
    .tip { border-left: 3px solid var(--sun); border-radius: 12px; background: linear-gradient(135deg, #fff8c9, #e4f8d8); padding: 14px 16px; font-size: 13px; line-height: 1.5; }
    .fade { animation: rise .45s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes floatIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes backgroundDrift { from { background-position: 0 0, 100% 0, 80% 100%, 20% 50%, 0 0; } to { background-position: 8% 5%, 94% 8%, 74% 94%, 26% 56%, 22px 22px; } }
    @keyframes gradientFlow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes resultGradient { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes colorPulse { 0%, 100% { color: var(--leaf); } 33% { color: var(--blue); } 66% { color: var(--purple); } }
    @keyframes tipGlow { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
    body[data-category="Lighting & effects"] { --paper: #0d1026; --ink: #f4f1ff; --muted: #aaa8cf; --line: #34346a; --panel: rgba(22, 22, 58, .86); --shadow: 0 22px 60px rgba(34, 12, 94, .46); background-image: radial-gradient(circle at 15% 15%, rgba(0, 229, 255, .3), transparent 24%), radial-gradient(circle at 85% 20%, rgba(255, 0, 170, .28), transparent 25%), linear-gradient(135deg, #080b1f, #18104a 48%, #210c3b); }
    body[data-category="all"] { --paper: #f7f3ff; --ink: #25223b; --muted: #716d86; --line: #e5ddf1; --panel: rgba(255, 255, 255, .82); --shadow: 0 22px 60px rgba(88, 64, 150, .16); background-image: radial-gradient(circle at 10% 8%, rgba(255, 212, 71, .36), transparent 22%), radial-gradient(circle at 88% 12%, rgba(78, 159, 255, .3), transparent 24%), radial-gradient(circle at 72% 88%, rgba(69, 173, 106, .24), transparent 25%), radial-gradient(circle at 38% 62%, rgba(239, 91, 104, .16), transparent 22%), radial-gradient(#dfd5f1 1px, transparent 1px); background-size: auto, auto, auto, auto, 22px 22px; }
    body[data-category="all"] .result-hero { background: linear-gradient(120deg, #28734b 0%, #4e9fff 30%, #7654e8 57%, #ef5b68 82%, #ffd447 125%); }
    body[data-category="Lighting & effects"] .result-hero { background: linear-gradient(120deg, #071a3d, #5516a6, #e6009d, #00c9ff); }
    body[data-category="Home automation"] { --paper: #f0f8ee; --line: #c9e0c3; --panel: rgba(255,255,255,.88); --shadow: 0 22px 60px rgba(49, 119, 67, .16); background-image: radial-gradient(circle at 12% 8%, rgba(255, 212, 71, .3), transparent 24%), radial-gradient(circle at 88% 15%, rgba(69, 173, 106, .28), transparent 26%), linear-gradient(135deg, #edf9ef, #fff9dc); }
    body[data-category="Home automation"] .result-hero { background: linear-gradient(120deg, #28734b, #49ad6d, #ffd447); }
    body[data-category="Robotics"] { --paper: #eef3f8; --line: #c8d6e5; --panel: rgba(255,255,255,.9); --shadow: 0 22px 60px rgba(46, 76, 111, .18); background-image: linear-gradient(135deg, rgba(78, 159, 255, .18) 1px, transparent 1px), linear-gradient(45deg, rgba(118, 84, 232, .12) 1px, transparent 1px), linear-gradient(135deg, #edf5ff, #f4efff); background-size: 28px 28px, 28px 28px, auto; }
    body[data-category="Robotics"] .result-hero { background: linear-gradient(120deg, #26384f, #4e9fff, #7654e8); }
    body[data-category="Security & access"] { --paper: #171525; --ink: #f8efff; --muted: #b6aecb; --line: #44385e; --panel: rgba(31, 27, 53, .9); --shadow: 0 22px 60px rgba(8, 4, 22, .5); background-image: radial-gradient(circle at 20% 20%, rgba(239, 91, 104, .22), transparent 24%), radial-gradient(circle at 85% 75%, rgba(118, 84, 232, .24), transparent 26%), linear-gradient(135deg, #121020, #281a39); }
    body[data-category="Security & access"] .result-hero { background: linear-gradient(120deg, #26142d, #ef5b68, #7654e8); }
    body[data-category="Games & interaction"] { --paper: #fff4fb; --line: #f0cce5; --panel: rgba(255,255,255,.9); --shadow: 0 22px 60px rgba(210, 71, 140, .16); background-image: radial-gradient(circle at 12% 12%, rgba(255, 212, 71, .32), transparent 22%), radial-gradient(circle at 88% 16%, rgba(118, 84, 232, .24), transparent 24%), linear-gradient(135deg, #fff2f8, #f1f3ff); }
    body[data-category="Games & interaction"] .result-hero { background: linear-gradient(120deg, #ef5b68, #7654e8, #4e9fff, #ffd447); }
    body[data-category="Sound & music"] { --paper: #fff3e8; --line: #f2c9a8; --panel: rgba(255,255,255,.9); --shadow: 0 22px 60px rgba(181, 91, 49, .16); background-image: radial-gradient(circle at 15% 15%, rgba(255, 212, 71, .34), transparent 24%), radial-gradient(circle at 85% 18%, rgba(239, 91, 104, .2), transparent 25%), linear-gradient(135deg, #fff3e6, #f4eaff); }
    body[data-category="Sound & music"] .result-hero { background: linear-gradient(120deg, #ef5b68, #ff9f43, #7654e8); }
    body[data-category="Wearables"] { --paper: #eefcf8; --line: #bfe7dc; --panel: rgba(255,255,255,.9); --shadow: 0 22px 60px rgba(49, 142, 128, .16); background-image: radial-gradient(circle at 12% 10%, rgba(98, 216, 189, .3), transparent 24%), radial-gradient(circle at 88% 12%, rgba(78, 159, 255, .22), transparent 24%), linear-gradient(135deg, #edfff8, #eef3ff); }
    body[data-category="Wearables"] .result-hero { background: linear-gradient(120deg, #28734b, #62d8bd, #4e9fff); }
    body[data-category="Sensors & monitoring"] { --paper: #eff8ff; --line: #c5dfee; --panel: rgba(255,255,255,.9); --shadow: 0 22px 60px rgba(42, 121, 174, .16); background-image: radial-gradient(circle at 15% 15%, rgba(78, 159, 255, .26), transparent 24%), radial-gradient(circle at 85% 70%, rgba(69, 173, 106, .2), transparent 26%), linear-gradient(135deg, #eef9ff, #f3fff1); }
    body[data-category="Sensors & monitoring"] .result-hero { background: linear-gradient(120deg, #28734b, #4e9fff, #75c9ff); }
    body[data-category="Displays & interfaces"] .result-hero { background: linear-gradient(120deg, #26384f, #4e9fff, #7654e8); }
    body[data-category="Wireless & communication"] .result-hero { background: linear-gradient(120deg, #075985, #4e9fff, #62d8bd); }
    body[data-category="Data & logging"] .result-hero { background: linear-gradient(120deg, #315b40, #49ad6d, #4e9fff); }

    @media (prefers-reduced-motion: reduce) {

    const projectThemes = [

    function wiresFor(parts) {
      const pinMap = {
        LED: ['D5', 'LED anode through a 220 ohm resistor'],
        Button: ['D2', 'Button to ground using INPUT_PULLUP'],
        Buzzer: ['D6', 'Buzzer positive lead'],
        'OLED display': ['A4 / SDA', 'OLED data and clock on the I2C bus'],
        Servo: ['D9', 'Servo signal lead'],
        Potentiometer: ['A0', 'Potentiometer middle pin'],
        'Ultrasonic sensor': ['D7 / D8', 'Trigger and echo signal pins'],
        'Motion sensor': ['D3', 'Motion sensor signal'],
        Neopixel: ['D6', 'Neopixel data in'],
        Joystick: ['A0 / A1', 'Joystick X and Y outputs']
      };
      return parts.map((part, index) => pinMap[part] || [`IO${index + 2}`, `${part} signal or control connection`]).concat([['GND', 'Shared ground rail']]);
    }

    function categoryFor(name, parts) {
      const text = `${name} ${parts.join(' ')}`.toLowerCase();
      if (/servo|motor|robot|conveyor|stepper|fan/.test(text)) return 'Robotics';
      if (/wearable|pocket|badge|posture|tilt|motion/.test(text)) return 'Wearables';
      if (/security|lock|access|rfid|fingerprint|door|alarm/.test(text)) return 'Security & access';
      if (/wifi|wireless|bluetooth|ble|remote|messenger|communication/.test(text)) return 'Wireless & communication';
      if (/display|screen|oled|lcd|epaper|matrix|menu|clock/.test(text)) return 'Displays & interfaces';
      if (/buzzer|speaker|sound|music|piano|theremin|morse/.test(text)) return 'Sound & music';
      if (/led|light|lamp|neopixel|pixel|color|beacon/.test(text)) return 'Lighting & effects';
      if (/logger|log|sd card|gps|rtc|data|weather/.test(text)) return 'Data & logging';
      if (/timer|counter|shortcut|checklist|productivity|tool|tester/.test(text)) return 'Tools & productivity';
      if (/game|reaction|fortune|joystick|button|keypad|creature/.test(text)) return 'Games & interaction';
      if (/plant|climate|temperature|humidity|soil|rain|gas|flame|sensor|quality|water/.test(text)) return 'Sensors & monitoring';
      return 'Home automation';

      'Home automation': {
        label: 'Home automation logic',
        text: 'Use clear trigger thresholds, add a cooldown so devices do not rapidly switch, and test every output with a low-voltage load first. Never connect mains electricity directly to a breadboard.'

        label: 'Wearable logic',
        text: 'Keep the enclosure light and comfortable, avoid sharp edges, use gentle vibration or brightness levels, and include a low-battery state before the device becomes unreliable.'

      Robotics: {
        label: 'Robotics logic',
        text: 'Limit servo angles and motor speed in software, start movement slowly, and test movement patterns with the mechanism unloaded before attaching delicate parts.'

        text: 'Separate normal, warning, and alarm states. Add an obvious reset path, avoid relying on one sensor alone, and remember that this prototype is not a replacement for a certified security system.'

      'Lighting & effects': 'Lighting chaos: add a color that means “the machine has an opinion.”',

      }
      const boardCompatible = boardCatalog.filter(project => {
        const matchingParts = project.parts.filter(part => parts.includes(part)).length;
        return project.board === board && matchesCategory(project) && matchingParts > 0 && (project.level === difficulty || difficulty === 'Hard');
      });
      const expansionCompatible = expansionCatalog.filter(project => {
        const matchingParts = project.parts.filter(part => parts.includes(part)).length;
        return project.board === board && matchesCategory(project) && matchingParts > 0 && (project.level === difficulty || difficulty === 'Hard');
      });
      const genericCompatible = projectCatalog.filter(project => {
        const matchingParts = project.parts.filter(part => parts.includes(part)).length;
        return matchesCategory(project) && matchingParts > 0 && (project.level === difficulty || difficulty === 'Hard');
      });
      const pool = [
        ...boardCompatible,
        ...boardCompatible,
        ...expansionCompatible,
        ...expansionCompatible,
        ...genericCompatible
      ];
      const categorizedFallback = allProjects.filter(matchesCategory);
      const fallback = boardCompatible.length ? boardCompatible : genericCompatible.length ? genericCompatible : categorizedFallback.length ? categorizedFallback : allProjects;
      return (pool.length ? pool : fallback)[Math.floor(Math.random() * (pool.length || fallback.length))];
    }

    function starterCode(board, idea) {
      const parts = idea.parts;
      const has = part => parts.includes(part);
      const title = idea.title.replace(/`/g, '\\`');

      if (has('Ultrasonic sensor')) {
        return `// ${title}\n// Board: ${board}\n// Distance changes the light and sound response.\n\nconst int TRIG_PIN = 7;\nconst int ECHO_PIN = 8;\nconst int LED_PIN = 5;${has('Buzzer') ? '\nconst int BUZZER_PIN = 6;' : ''}\n\nlong readDistanceCm() {\n  digitalWrite(TRIG_PIN, LOW);\n  delayMicroseconds(2);\n  digitalWrite(TRIG_PIN, HIGH);\n  delayMicroseconds(10);\n  digitalWrite(TRIG_PIN, LOW);\n  long duration = pulseIn(ECHO_PIN, HIGH, 30000);\n  return duration == 0 ? 400 : duration / 58;\n}\n\nvoid setup() {\n  pinMode(TRIG_PIN, OUTPUT);\n  pinMode(ECHO_PIN, INPUT);\n  pinMode(LED_PIN, OUTPUT);${has('Buzzer') ? '\n  pinMode(BUZZER_PIN, OUTPUT);' : ''}\n  Serial.begin(115200);\n}\n\nvoid loop() {\n  long distance = readDistanceCm();\n  int brightness = constrain(map(distance, 5, 100, 255, 10), 10, 255);\n  analogWrite(LED_PIN, brightness);${has('Buzzer') ? '\n  if (distance < 25) tone(BUZZER_PIN, map(distance, 5, 25, 1200, 300), 80);' : ''}\n  Serial.print("Distance: ");\n  Serial.print(distance);\n  Serial.println(" cm");\n  delay(120);\n}`;
      }

      if (has('Temperature sensor') || has('Humidity sensor') || has('Light sensor') || has('Soil moisture sensor')) {
        const sensor = has('Soil moisture sensor') ? 'SOIL_PIN' : has('Light sensor') ? 'LIGHT_PIN' : 'SENSOR_PIN';
        return `// ${title}\n// Board: ${board}\n// A slow, readable sensor monitor.\n\nconst int ${sensor} = A0;\nconst int LED_PIN = 5;${has('Button') ? '\nconst int BUTTON_PIN = 2;' : ''}\n\nvoid setup() {\n  pinMode(LED_PIN, OUTPUT);${has('Button') ? '\n  pinMode(BUTTON_PIN, INPUT_PULLUP);' : ''}\n  Serial.begin(115200);\n}\n\nvoid loop() {\n  int reading = analogRead(${sensor});\n  int level = map(reading, 0, 1023, 0, 255);\n  analogWrite(LED_PIN, level);\n  Serial.print("Reading: ");\n  Serial.println(reading);${has('Button') ? '\n  if (digitalRead(BUTTON_PIN) == LOW) Serial.println("Snapshot requested");' : ''}\n  delay(500);\n}`;
      }

      if (has('Servo')) {
        return `// ${title}\n// Board: ${board}\n// Move the servo between two expressive positions.\n\n#include <Servo.h>\n\nServo buildServo;\nconst int SERVO_PIN = 9;\nconst int INPUT_PIN = ${has('Potentiometer') ? 'A0' : '2'};\n\nvoid setup() {\n  buildServo.attach(SERVO_PIN);${has('Potentiometer') ? '' : '\n  pinMode(INPUT_PIN, INPUT_PULLUP);'}\n  Serial.begin(115200);\n}\n\nvoid loop() {${has('Potentiometer') ? '\n  int angle = map(analogRead(INPUT_PIN), 0, 1023, 10, 170);' : '\n  int angle = digitalRead(INPUT_PIN) == LOW ? 170 : 10;'}\n  buildServo.write(angle);\n  Serial.print("Servo angle: ");\n  Serial.println(angle);\n  delay(25);\n}`;
      }

      if (has('Buzzer') || has('Speaker') || has('Magnetic buzzer')) {
        return `// ${title}\n// Board: ${board}\n// A button becomes a tiny instrument.\n\nconst int BUTTON_PIN = 2;\nconst int SOUND_PIN = 6;\nconst int LED_PIN = 5;\nint note = 0;\nconst int notes[] = {262, 330, 392, 523};\n\nvoid setup() {\n  pinMode(BUTTON_PIN, INPUT_PULLUP);\n  pinMode(LED_PIN, OUTPUT);\n  Serial.begin(115200);\n}\n\nvoid loop() {\n  if (digitalRead(BUTTON_PIN) == LOW) {\n    tone(SOUND_PIN, notes[note], 140);\n    digitalWrite(LED_PIN, HIGH);\n    Serial.print("Note: ");\n    Serial.println(notes[note]);\n    note = (note + 1) % 4;\n    delay(180);\n    digitalWrite(LED_PIN, LOW);\n  }\n}`;
      }

      if (has('OLED display') || has('LCD display') || has('E-paper display')) {
        return `// ${title}\n// Board: ${board}\n// Display idea: start with Serial, then connect your display library.\n\nconst int BUTTON_PIN = 2;\nconst int LED_PIN = 5;\nunsigned long eventCount = 0;\n\nvoid setup() {\n  pinMode(BUTTON_PIN, INPUT_PULLUP);\n  pinMode(LED_PIN, OUTPUT);\n  Serial.begin(115200);\n  Serial.println("Display project ready");\n}\n\nvoid loop() {\n  if (digitalRead(BUTTON_PIN) == LOW) {\n    eventCount++;\n    digitalWrite(LED_PIN, HIGH);\n    Serial.print("Screen message #");\n    Serial.println(eventCount);\n    delay(180);\n    digitalWrite(LED_PIN, LOW);\n  }\n}`;
      }

      return `// ${title}\n// Board: ${board}\n// A reaction loop with a changing challenge.\n\nconst int BUTTON_PIN = 2;\nconst int LED_PIN = 5;\nunsigned long nextSignal;\n\nvoid setup() {\n  pinMode(BUTTON_PIN, INPUT_PULLUP);\n  pinMode(LED_PIN, OUTPUT);\n  Serial.begin(115200);\n  randomSeed(analogRead(A0));\n  nextSignal = millis() + random(1000, 3500);\n}\n\nvoid loop() {\n  if (millis() >= nextSignal) {\n    digitalWrite(LED_PIN, HIGH);\n    unsigned long started = millis();\n    while (digitalRead(BUTTON_PIN) == HIGH) {\n      if (millis() - started > 5000) break;\n    }\n    unsigned long reaction = millis() - started;\n    digitalWrite(LED_PIN, LOW);\n    Serial.print("Reaction: ");\n    Serial.print(reaction);\n    Serial.println(" ms");\n    delay(300);\n    nextSignal = millis() + random(1000, 3500);\n  }\n}`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, function (character) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character];
      });
    }

    function safetyNote(parts) {
      if (parts.includes('Relay module') || parts.includes('Fan')) return 'Safety note: prototype with low voltage only; never connect mains power directly to the board.';
      if (parts.includes('Servo') || parts.includes('DC motor') || parts.includes('Stepper motor')) return 'Safety note: use a separate suitable power supply for motors and keep fingers clear of moving parts.';
      if (parts.includes('Laser diode')) return 'Safety note: never point a laser at eyes, vehicles, or reflective surfaces.';
      if (parts.includes('Battery holder')) return 'Safety note: check polarity, avoid short circuits, and never charge cells with an unsuitable circuit.';
      return 'Wiring note: disconnect power before changing connections and check the board voltage before attaching a module.';
    }

    function personalityItems(category, personality, secretEnabled) {
      const items = [];
      if (categoryChaos[category]) items.push(categoryChaos[category]);
      if (guidedBehaviors[personality]) items.push(...guidedBehaviors[personality].items);
      if (secretEnabled) items.push(secretBehaviors[Math.floor(Math.random() * secretBehaviors.length)]);
      return items;
    }

    function render(ideaOverride) {
      const board = document.getElementById('board').value;
      const difficulty = document.getElementById('difficulty').value;
      const parts = selectedParts();
      const mode = document.getElementById('mode').value;
      const category = document.getElementById('category').value;
      const personality = document.getElementById('personality').value;
      const secretEnabled = document.getElementById('secretMode').checked;
      const idea = ideaOverride || pickIdea(parts, difficulty, mode);
      currentIdea = idea;
      document.body.dataset.category = category === 'all' ? 'all' : idea.category || category;
      const allParts = [...new Set([...idea.parts, ...parts])];
      const code = starterCode(board, idea);
      const logic = categoryLogic[idea.category || category] || {
        label: 'Build logic',
        text: 'Make one clear input cause one clear response first. Add complexity only after the basic loop is reliable.'
      };
      const behaviorItems = personalityItems(idea.category || category, personality, secretEnabled);

      document.getElementById('result').innerHTML = `
        <div class="result-hero fade">
          <div class="eyebrow">Your next build</div>
          <h2>${escapeHtml(idea.title)}</h2>
          <p>${escapeHtml(idea.description)}</p>
          <div class="meta">
            <span>${escapeHtml(board)}</span>
            <span>${escapeHtml(idea.level || difficulty).toUpperCase()}</span>
            <span>${escapeHtml(idea.category || category)}</span>
            <span>${allParts.length} PARTS IN PLAY</span>
          </div>
        </div>

        <div class="result-body fade">
          <div class="info-block">
            <h3>Gather these</h3>
            <ul>${allParts.map(part => `<li>${escapeHtml(part)}</li>`).join('')}</ul>
          </div>

          <div class="info-block">
            <h3>First milestone</h3>
            <p style="color:var(--muted);font-size:14px;line-height:1.6;margin:0">Get one input to cause one visible response. Ignore polish until that tiny loop works.</p>
          </div>

          <div class="info-block full">
            <h3>Pin map</h3>
            ${(idea.wires || []).map(wire => `<div class="wire"><span class="pin">${escapeHtml(wire[0])}</span><span>${escapeHtml(wire[1])}</span></div>`).join('')}
          </div>

          <div class="info-block full">
            <div class="tip"><strong>Workshop note:</strong> ${escapeHtml(idea.tip)}</div>
          </div>

          <div class="info-block full">
            <div class="tip"><strong>${escapeHtml(logic.label)}:</strong> ${escapeHtml(logic.text)}</div>
          </div>

          <div class="info-block full">
            <div class="tip"><strong>Build systems:</strong> ${behaviorItems.length ? behaviorItems.map(escapeHtml).join(' ') : 'Enable a personality or secret behaviors to add night rituals, visitor events, battery drama, and hidden input sequences.'}</div>
          </div>

          <div class="info-block full">
            <div class="tip"><strong>Wiring &amp; safety:</strong> ${escapeHtml(safetyNote([...new Set([...idea.parts, ...parts])]))}</div>
          </div>

          <div class="info-block full">
            <h3>Starter sketch</h3>
            <div class="code-wrap">
              <button class="copy" id="copy">COPY CODE</button>
              <pre id="code">${escapeHtml(code)}</pre>
            </div>
          </div>
        </div>
      `;

      document.getElementById('copy').addEventListener('click', async () => {
        await navigator.clipboard.writeText(document.getElementById('code').textContent);
        document.getElementById('copy').textContent = 'COPIED';
        setTimeout(() => document.getElementById('copy').textContent = 'COPY CODE', 1300);
      });
    }

    let currentIdea;
    const strangePrefixes = [
      'Cursed', 'Alien', 'Suspicious', 'Unreasonably Fancy', 'Haunted', 'Time-Traveling', 'Overdramatic', 'Mysterious',
      'Sentient', 'Telepathic', 'Invisible', 'Glitter-powered', 'Deeply Polite', 'Aggressively Helpful', 'Sleepy',
      'Paranoid', 'Cosmic', 'Interdimensional', 'Backwards', 'Sideways', 'Undercover', 'Unlicensed', 'Forbidden',
      'Royal', 'Tiny', 'Giant', 'Possessed', 'Nervous', 'Dramatic', 'Whispering', 'Singing', 'Jealous',
      'Forgetful', 'Overqualified', 'Underwater', 'Moonlit', 'Solar-powered', 'Time-looping', 'Magnetic',
      'Radioactive-looking', 'Emotionally Complicated', 'Possibly Legal', 'Unnecessarily Complex', 'Very Round',

      'Make it act like it has just returned from a long journey.',
      'Add a random “philosophical question” event.',
      'Make it celebrate whenever a sensor reading is perfectly average.'
    ];

    const boardModel = document.getElementById('boardModel');
    const boardStage = document.getElementById('boardStage');
    const boardSelect = document.getElementById('board');

    function updateBoardModel() {
      boardModel.dataset.board = boardSelect.value;
      boardModel.setAttribute('aria-label', `${boardSelect.value} 3D board preview`);
    }

    boardStage.addEventListener('pointermove', event => {
      const bounds = boardStage.getBoundingClientRect();
      const horizontal = (event.clientX - bounds.left) / bounds.width - .5;
      const vertical = (event.clientY - bounds.top) / bounds.height - .5;
      boardModel.style.setProperty('--tilt-x', `${horizontal * 28}deg`);
      boardModel.style.setProperty('--tilt-y', `${vertical * -24}deg`);
    });

    boardStage.addEventListener('pointerleave', () => {
      boardModel.style.setProperty('--tilt-x', '0deg');
      boardModel.style.setProperty('--tilt-y', '0deg');
    });

    boardSelect.addEventListener('change', updateBoardModel);
    updateBoardModel();

    document.getElementById('stranger').addEventListener('click', () => {
      const base = currentIdea || pickIdea(selectedParts(), document.getElementById('difficulty').value);
      const category = base.category || document.getElementById('category').value;
      const chaos = categoryChaos[category] || 'Chaos rule: give the build one harmless behavior that nobody can explain.';
      const strangeIdea = {
        ...base,
        title: `${strangePrefixes[Math.floor(Math.random() * strangePrefixes.length)]} ${base.title}`,
        description: `${base.description} ${chaos} ${strangeActions[Math.floor(Math.random() * strangeActions.length)]}`,
        tip: `Strangeness rule: ${chaos} Keep the core interaction working before adding the weird behavior.`
      };
      render(strangeIdea);
    });

    document.getElementById('generate').addEventListener('click', () => render());
    document.getElementById('surprise').addEventListener('click', () => {
      const mode = document.getElementById('mode').value;
      const board = document.getElementById('board').value;
      const inputs = [...document.querySelectorAll('.part input')];
      const partNames = inputs.map(input => input.value);
      const source = mode === 'useful'
        ? usefulThemes[board].flatMap(theme => theme.parts)
        : partNames;
      const candidates = [...new Set(source)].filter(part => partNames.includes(part));
      inputs.forEach(input => input.checked = false);
      candidates.sort(() => Math.random() - 0.5).slice(0, mode === 'useful' ? 4 : 6).forEach(part => {
        const input = inputs.find(candidate => candidate.value === part);
        if (input) input.checked = true;
      });
      if (!document.querySelector('.part input:checked')) inputs[0].checked = true;
      render();
    });

    render();
  </script>
